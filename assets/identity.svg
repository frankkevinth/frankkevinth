<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Frank Kevin — Systems Analyst, Computer Engineer and Technology Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090B"/>
      <stop offset=".58" stop-color="#101215"/>
      <stop offset="1" stop-color="#191B1E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".085"/>
      <stop offset=".43" stop-color="#FFFFFF" stop-opacity=".026"/>
      <stop offset="1" stop-color="#E1E3E8" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".36"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(340 10) rotate(83) scale(680 610)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".11"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1280" height="640" rx="24"/></clipPath>
  </defs>
  <style>
    /* Install Outfit locally for editing. For exact GitHub rendering, convert text to SVG paths later. */
    .outfit { font-family: 'Outfit', 'Inter', 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .white { fill:#F6F6F6; }
    .silver { fill:#B7B9BD; }
    .gray { fill:#8A8E93; }
    .caption { font-size:14px; letter-spacing:2px; }
    .appear { animation: up .8s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay:.08s; } .d2 { animation-delay:.22s; }
    .d3 { animation-delay:.37s; } .d4 { animation-delay:.52s; }
    .shine { animation: drift 10s ease-in-out infinite; }
    @keyframes up { from { opacity:0; transform:translateY(9px); } to { opacity:1; transform:translateY(0); } }
    @keyframes drift { 0%,100% { opacity:.24; } 50% { opacity:.5; } }
    @media (prefers-reduced-motion: reduce) { .appear,.shine { animation:none; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1280" height="640" fill="url(#bg)"/>
    <rect width="1280" height="640" fill="url(#light)"/>
    <path d="M0 0 L460 0 L260 640 L0 640Z" fill="#FFFFFF" opacity=".009"/>
    <path d="M390 0 L430 0 L225 640 L185 640Z" fill="#FFFFFF" opacity=".018" class="shine"/>
    <rect x="22" y="22" width="1236" height="596" rx="19" fill="none" stroke="#FFFFFF" stroke-opacity=".19"/>
    <!-- Editorial top bar -->
    <g class="appear d1">
      <text x="70" y="78" class="outfit white" font-size="18" font-weight="500" letter-spacing=".9">FRANK KEVIN</text>
      <text x="1208" y="78" text-anchor="end" class="mono gray" font-size="13" letter-spacing="1.4">SYSTEMS / SOFTWARE / AUTOMATION</text>
      <path d="M70 104 H1210" stroke="#FFFFFF" stroke-opacity=".16"/>
    </g>
    <!-- Main identity, no portrait, no monogram -->
    <g class="appear d2">
      <text x="70" y="230" class="outfit white" font-size="84" font-weight="500" letter-spacing="-2">Frank Kevin<tspan fill="#80858B">.</tspan></text>
      <text x="73" y="282" class="outfit silver" font-size="26" font-weight="350">Systems Analyst  /  Computer Engineer</text>
      <path d="M73 317 H139" stroke="#EAEAEA" stroke-width="2"/>
      <text x="73" y="362" class="outfit silver" font-size="20" font-weight="300">Postgraduate studies in</text>
      <text x="73" y="394" class="outfit white" font-size="22" font-weight="400">AI &amp; Neural Networks</text>
    </g>
    <g class="appear d3">
      <text x="73" y="507" class="outfit gray" font-size="18" font-weight="300">Building and improving enterprise systems</text>
      <text x="73" y="534" class="outfit gray" font-size="18" font-weight="300">through development and automation.</text>
    </g>
    <path d="M645 142 V566" stroke="#FFFFFF" stroke-opacity=".12"/>
    <!-- Soft grayscale glass panel -->
    <g class="appear d3">
      <rect x="684" y="136" width="525" height="424" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.15"/>
      <text x="714" y="184" class="outfit white" font-size="27" font-weight="500">Technologies</text>
      <text x="1178" y="179" text-anchor="end" class="mono gray" font-size="12" letter-spacing="1">01 / 03</text>
      <path d="M714 207 H1180" stroke="#FFFFFF" stroke-opacity=".14"/>
    </g>
    <g class="appear d3">
      <text x="714" y="239" class="mono gray caption">DATABASES &amp; ERP</text>
      <text x="714" y="271" class="outfit white" font-size="21" font-weight="400">Oracle Database <tspan fill="#777B80">/</tspan> SQL <tspan fill="#777B80">/</tspan> PL/SQL</text>
      <text x="714" y="297" class="outfit silver" font-size="20" font-weight="350">Sankhya ERP</text>
      <path d="M714 321 H1180" stroke="#FFFFFF" stroke-opacity=".12"/>
    </g>
    <g class="appear d4">
      <text x="714" y="350" class="mono gray caption">PROGRAMMING &amp; WEB</text>
      <text x="714" y="382" class="outfit white" font-size="21" font-weight="400">Java <tspan fill="#777B80">/</tspan> JavaScript <tspan fill="#777B80">/</tspan> TypeScript</text>
      <text x="714" y="408" class="outfit silver" font-size="20" font-weight="350">HTML <tspan fill="#777B80">/</tspan> CSS</text>
      <path d="M714 433 H1180" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="714" y="465" class="mono gray caption">TOOLS &amp; FOCUS</text>
      <text x="714" y="499" class="outfit white" font-size="21" font-weight="400">Git <tspan fill="#777B80">/</tspan> GitHub <tspan fill="#777B80">/</tspan> VS Code</text>
      <text x="714" y="527" class="outfit silver" font-size="19" font-weight="350">Systems Integration <tspan fill="#777B80">/</tspan> Automation</text>
    </g>
    <path d="M70 582 H1210" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="70" y="606" class="mono gray" font-size="12" letter-spacing="1.5">ENGINEERING WHAT MATTERS</text>
    <text x="1210" y="606" text-anchor="end" class="mono silver" font-size="12" letter-spacing="1.2">GITHUB PROFILE / FK</text>
  </g>
</svg>